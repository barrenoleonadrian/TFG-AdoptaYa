# Configuración de Nginx para servir el frontend de AdoptaYa
# y reenviar las peticiones a la API al backend.

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # tamaño máximo de subida (para fotos de mascotas y refugios)
    client_max_body_size 10M;

    # ===== imágenes =====
    # primero intenta servir el archivo localmente desde el frontend (logo, hero...).
    # si no existe, reenvía la petición al backend (fotos subidas por usuarios).
    location /img/ {
        try_files $uri @backend;
    }

    # ===== rutas del backend (proxy) =====
    location ~ ^/(login|register|mascotas|refugios|mi-refugio|mensajes|mis-mascotas|mis-solicitudes|mis-solicitudes-adoptante|admin) {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # destino para las imágenes que no están en el frontend (fallback al backend)
    location @backend {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ===== servir el frontend SPA =====
    # si la ruta no es del backend ni una imagen, devolvemos siempre index.html
    # (para que el router por hash de React funcione)
    location / {
        try_files $uri $uri/ /index.html;
    }
}